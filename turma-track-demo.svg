<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Demonstração do TurmaTrack no terminal</title>
  <desc id="desc">Relatório de uma turma com médias, aprovações e ranking.</desc>
  <rect width="1200" height="690" rx="28" fill="#07111f"/>
  <rect x="24" y="24" width="1152" height="642" rx="18" fill="#0d1829" stroke="#26364d" stroke-width="2"/>
  <circle cx="58" cy="58" r="8" fill="#ff5f57"/>
  <circle cx="84" cy="58" r="8" fill="#febc2e"/>
  <circle cx="110" cy="58" r="8" fill="#28c840"/>
  <text x="600" y="66" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#91a4bd">turma-track-cpp</text>
  <line x1="24" y1="88" x2="1176" y2="88" stroke="#26364d" stroke-width="2"/>
  <g font-family="Consolas, monospace">
    <text x="70" y="135" font-size="24" font-weight="700" fill="#45d5ff">TURMATRACK</text>
    <text x="70" y="168" font-size="18" fill="#91a4bd">Acompanhamento de desempenho</text>
    <text x="70" y="224" font-size="20" font-weight="700" fill="#a78bfa">--- Alunos da turma ---</text>
    <text x="70" y="264" font-size="17" fill="#e6edf7">Codigo   Nome                         N1      N2      N3    Media    Situacao</text>
    <text x="70" y="294" font-size="17" fill="#52657e">----------------------------------------------------------------------------</text>
    <text x="70" y="327" font-size="17" fill="#c9d5e5">101      Ana Souza                   8.0     9.0     7.5      8.2    Aprovado</text>
    <text x="70" y="360" font-size="17" fill="#c9d5e5">102      Bruno Lima                  6.0     5.5     7.0      6.2   Reprovado</text>
    <text x="70" y="393" font-size="17" fill="#c9d5e5">103      Carla Alves                 9.5     8.5     9.0      9.0    Aprovado</text>
    <text x="70" y="455" font-size="20" font-weight="700" fill="#a78bfa">--- Relatorio da turma ---</text>
    <text x="70" y="493" font-size="17" fill="#e6edf7">Alunos cadastrados: 3</text>
    <text x="70" y="526" font-size="17" fill="#e6edf7">Media geral: 7.8</text>
    <text x="70" y="559" font-size="17" fill="#52e0a4">Aprovados: 2 (66.7%)</text>
    <text x="70" y="592" font-size="17" fill="#ff8a8a">Reprovados: 1 (33.3%)</text>
    <text x="70" y="625" font-size="17" fill="#45d5ff">Maior media: Carla Alves (9.0)</text>
  </g>
</svg>
